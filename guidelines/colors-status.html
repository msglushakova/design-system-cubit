<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{background:var(--bg-page);color:var(--text-primary);font-family:var(--font-body);padding:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:.06em}
</style></head><body>
<div class="row" style="gap:10px;flex-wrap:nowrap"><div style="flex:1;min-width:120px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--success);border:1px solid var(--border-subtle)"></div><div class="lbl" style="margin-top:6px">--success</div><div class="lbl">#3BAE6B</div></div><div style="flex:1;min-width:120px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--warning);border:1px solid var(--border-subtle)"></div><div class="lbl" style="margin-top:6px">--warning</div><div class="lbl">#E9A33B</div></div><div style="flex:1;min-width:120px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--danger);border:1px solid var(--border-subtle)"></div><div class="lbl" style="margin-top:6px">--danger</div><div class="lbl">#ED4401</div></div><div style="flex:1;min-width:120px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--accent-soft);border:1px solid var(--border-subtle)"></div><div class="lbl" style="margin-top:6px">--accent-soft</div><div class="lbl">orange 14%</div></div></div></body></html>
