<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{background:var(--bg-page);color:var(--text-primary);font-family:var(--font-body);padding:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:.06em}
</style></head><body>
<div data-theme="light" style="background:var(--bg-page);padding:16px;border-radius:var(--radius-md)"><div class="row" style="gap:10px;flex-wrap:nowrap"><div style="flex:1;min-width:120px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--bg-page);border:1px solid var(--border-subtle)"></div><div class="lbl" style="margin-top:6px">--bg-page</div><div class="lbl">#F3F3F3</div></div><div style="flex:1;min-width:120px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--bg-elevated);border:1px solid var(--border-subtle)"></div><div class="lbl" style="margin-top:6px">--bg-elevated</div><div class="lbl">#FFFFFF</div></div><div style="flex:1;min-width:120px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--bg-sunken);border:1px solid var(--border-subtle)"></div><div class="lbl" style="margin-top:6px">--bg-sunken</div><div class="lbl">#D3D3D3</div></div><div style="flex:1;min-width:120px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--text-primary);border:1px solid var(--border-subtle)"></div><div class="lbl" style="margin-top:6px">--text-primary</div><div class="lbl">#000000</div></div><div style="flex:1;min-width:120px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--accent);border:1px solid var(--border-subtle)"></div><div class="lbl" style="margin-top:6px">--accent</div><div class="lbl">#F34925</div></div></div></div></body></html>
