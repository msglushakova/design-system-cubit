<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{background:var(--bg-page);color:var(--text-primary);font-family:var(--font-body);padding:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:.06em}
</style></head><body>
<div class="row" style="gap:10px;flex-wrap:nowrap"><div style="flex:1;min-width:120px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--bg-page);border:1px solid var(--border-subtle)"></div><div class="lbl" style="margin-top:6px">--bg-page</div><div class="lbl">#030502</div></div><div style="flex:1;min-width:120px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--bg-elevated);border:1px solid var(--border-subtle)"></div><div class="lbl" style="margin-top:6px">--bg-elevated</div><div class="lbl">#0B0E0C</div></div><div style="flex:1;min-width:120px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--surface-card);border:1px solid var(--border-subtle)"></div><div class="lbl" style="margin-top:6px">--surface-card</div><div class="lbl">white 4%</div></div><div style="flex:1;min-width:120px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--border-subtle);border:1px solid var(--border-subtle)"></div><div class="lbl" style="margin-top:6px">--border-subtle</div><div class="lbl">white 10%</div></div><div style="flex:1;min-width:120px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--text-secondary);border:1px solid var(--border-subtle)"></div><div class="lbl" style="margin-top:6px">--text-secondary</div><div class="lbl">white 64%</div></div></div></body></html>
