<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{background:var(--bg-page);color:var(--text-primary);font-family:var(--font-body);padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:.06em}
.sw{flex:1;min-width:96px}.sw div:first-child{height:60px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}
</style></head><body data-theme="light">
<div class="row"><div class="sw"><div style="background:var(--bg-page)"></div><div class="lbl" style="margin-top:6px">--bg-page</div><div class="lbl">#FFFFFF</div></div><div class="sw"><div style="background:var(--surface-muted)"></div><div class="lbl" style="margin-top:6px">--surface-muted</div><div class="lbl">#F1F3F5</div></div><div class="sw"><div style="background:var(--border-subtle)"></div><div class="lbl" style="margin-top:6px">--border-subtle</div><div class="lbl">#DEE2E6</div></div><div class="sw"><div style="background:var(--text-primary)"></div><div class="lbl" style="margin-top:6px">--text-primary</div><div class="lbl">#1A1B1E</div></div><div class="sw"><div style="background:var(--accent)"></div><div class="lbl" style="margin-top:6px">--accent</div><div class="lbl">#0CA678</div></div><div class="sw"><div style="background:var(--accent-soft)"></div><div class="lbl" style="margin-top:6px">--accent-soft</div><div class="lbl">#E6FCF5</div></div></div>
</body></html>
