<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{width:1600px;height:900px;overflow:hidden;background:var(--bg-page)}
</style></head><body>
<section class="ss-slide ss-slide--hero">
<div style="display:flex;gap:40px;align-items:center;flex:1">
  <div style="flex:0 0 720px">
    <p class="ss-brand" style="font-size:30px;margin:0 0 56px"><img src="../assets/skillscape-mark.svg" alt="" style="width:40px;height:40px">SkillScape</p>
    <p class="ss-eyebrow">Карты компетенций · Ревью · Эссе · Цели</p>
    <h1 class="ss-h1" style="font-size:64px;line-height:1.04;max-width:620px">Одна платформа для <em>личного и командного</em> профессионального роста</h1>
    <p class="ss-lead">Подзаголовок: для кого эта презентация.</p>
  </div>
  <div style="flex:1;position:relative;height:640px">
    <figure class="ss-shot" style="position:absolute;width:900px;left:30px;top:40px;transform:perspective(1800px) rotateY(-9deg) rotateX(3deg)"><div class="ss-shot__bar"><i></i><i></i><i></i><span>skillscape.ru</span></div><img src="../assets/screen-dashboard.jpg" alt=""></figure>
    <figure class="ss-phone" style="position:absolute;width:210px;left:-30px;top:260px;padding:8px;border-radius:32px"><img src="../assets/screen-mobile.jpg" alt="" style="border-radius:24px"></figure>
  </div>
</div>
<div class="ss-slide__foot"><span>skillscape.ru</span><span class="ss-num">01</span></div>
</section>
</body></html>
