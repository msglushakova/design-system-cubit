<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
html,body{margin:0}body{background:var(--bg-page);color:var(--text-primary);font-family:var(--font-body);padding:24px}
.grid{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:var(--radius-pill);font-weight:600;font-size:16px;padding:12px 24px;cursor:pointer;font-family:inherit}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:.06em;width:100%}
</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
 <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:14px;color:var(--text-secondary)">Рабочая почта</span><input placeholder="name@company.ru" style="background:var(--bg-sunken);color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:8px;padding:12px 14px;font-size:16px;font-family:inherit"></label>
 <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:14px;color:var(--text-secondary)">Направление</span><select style="background:var(--bg-sunken);color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:8px;padding:12px 14px;font-size:16px;font-family:inherit"><option>Бизнес-анализ</option><option>Backend</option></select></label>
 <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:14px;color:var(--text-secondary)">Телефон</span><input value="+7 900" style="background:var(--bg-sunken);color:var(--text-primary);border:1px solid var(--danger);border-radius:8px;padding:12px 14px;font-size:16px;font-family:inherit"><span style="font-size:12px;color:var(--danger)">Укажите полный номер</span></label>
 <div style="display:flex;flex-direction:column;gap:14px;justify-content:center">
  <label style="display:inline-flex;align-items:center;gap:10px;font-size:16px"><span style="width:20px;height:20px;border-radius:4px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px">✓</span>Согласен с обработкой данных</label>
  <label style="display:inline-flex;align-items:center;gap:12px;font-size:16px"><span style="width:44px;height:26px;border-radius:999px;background:var(--accent);padding:3px;display:inline-flex"><span style="width:20px;height:20px;border-radius:999px;background:#fff;transform:translateX(18px)"></span></span>Тёмная тема</label>
 </div>
</div></body></html>
