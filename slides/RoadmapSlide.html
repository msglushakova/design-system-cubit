<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}
body{width:1280px;height:720px;overflow:hidden;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-body)}
.slide{width:1280px;height:720px;position:relative;box-sizing:border-box;padding:64px}
.eyebrow{font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.foot{position:absolute;left:64px;right:64px;bottom:40px;display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:13px;color:var(--text-muted)}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-.008em;text-wrap:pretty}
</style></head><body>
<div class="slide" style="display:flex;flex-direction:column;gap:32px">
 <div><div class="eyebrow">Цели и задачи</div><h2 style="font-size:52px;font-weight:700;margin-top:12px">Что сделано и что дальше</h2></div>
 <div style="display:flex;flex-direction:column;gap:0;flex:1">
  
  <div style="display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--border-subtle)">
   <span style="font-size:26px;font-weight:600">Мониторинг событий</span>
   <span style="padding:6px 14px;border-radius:999px;font-size:15px;font-weight:600;background:rgba(59,174,107,.16);color:var(--success)">Сделано</span>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--border-subtle)">
   <span style="font-size:26px;font-weight:600">Расширение каналов связи</span>
   <span style="padding:6px 14px;border-radius:999px;font-size:15px;font-weight:600;background:rgba(59,174,107,.16);color:var(--success)">Сделано</span>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--border-subtle)">
   <span style="font-size:26px;font-weight:600">Управление подписками на события</span>
   <span style="padding:6px 14px;border-radius:999px;font-size:15px;font-weight:600;background:var(--accent-soft);color:var(--accent)">В работе</span>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--border-subtle)">
   <span style="font-size:26px;font-weight:600">Настройка индивидуальных параметров</span>
   <span style="padding:6px 14px;border-radius:999px;font-size:15px;font-weight:600;background:var(--accent-soft);color:var(--accent)">В работе</span>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--border-subtle)">
   <span style="font-size:26px;font-weight:600">Эскалация проблем на дежурного</span>
   <span style="padding:6px 14px;border-radius:999px;font-size:15px;font-weight:600;background:var(--surface-card);color:var(--text-muted)">Далее</span>
  </div>
 </div>
 <div class="foot"><span>cubit.su</span><span>05</span></div>
</div></body></html>
