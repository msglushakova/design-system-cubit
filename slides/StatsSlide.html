<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}
body{width:1280px;height:720px;overflow:hidden;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-body)}
.slide{width:1280px;height:720px;position:relative;box-sizing:border-box;padding:64px}
.eyebrow{font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.foot{position:absolute;left:64px;right:64px;bottom:40px;display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:13px;color:var(--text-muted)}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-.008em;text-wrap:pretty}
</style></head><body>
<div class="slide" style="display:flex;flex-direction:column;justify-content:center;gap:56px">
 <div class="eyebrow">Итоги полугодия</div>
 <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:48px">
  
  <div><div style="font-size:112px;font-weight:700;line-height:.98;letter-spacing:-.02em;color:var(--text-primary)">1100</div>
  <div style="font-size:19px;line-height:1.4;color:var(--text-secondary);margin-top:12px;max-width:280px">человек ежедневно пользуются нашими продуктами</div></div>
  <div><div style="font-size:112px;font-weight:700;line-height:.98;letter-spacing:-.02em;color:var(--accent)">3</div>
  <div style="font-size:19px;line-height:1.4;color:var(--text-secondary);margin-top:12px;max-width:280px">крупных проекта в активе</div></div>
  <div><div style="font-size:112px;font-weight:700;line-height:.98;letter-spacing:-.02em;color:var(--text-primary)">24/7</div>
  <div style="font-size:19px;line-height:1.4;color:var(--text-secondary);margin-top:12px;max-width:280px">мониторинг событий и эскалация</div></div>
 </div>
 <div class="foot"><span>cubit.su</span><span>04</span></div>
</div></body></html>
